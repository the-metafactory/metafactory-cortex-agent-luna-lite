# agents.d/luna-light.yaml — Luna-Light agent fragment
#
# Installed by `arc install luna-light` into ~/.config/cortex/agents.d/.
# An in-process cortex agent that shares the stack's bus identity — it mints
# no NATS credentials of its own. Surface-neutral: no `presence:` block here,
# so Luna-Light binds to whatever surface your stack declares in surfaces.yaml.
#
# id is `luna-light` (routes as @luna-light) — deliberately distinct from a
# full `@luna`, so this starter assistant coexists with any Luna you already run.
id: luna-light
displayName: Luna-Light
persona: ~/.config/cortex/personas/luna-light.md
runtime:
  substrate: claude-code
  mode: in-process
  capabilities:
    - chat                 # responds to messages routed to @luna-light
    - async                # handles `async:` fire-and-forget tasks
# No `presence:` — see the manifest. To bind Luna-Light to a surface, add her to
# your stack's surfaces/surfaces.yaml (web or Discord). Example (Discord):
#
#   surfaces:
#     discord:
#       - agent: luna-light
#         stack: <your-slug>
#         binding: { token: __YOUR_BOT_TOKEN__, guildId: ..., agentChannelId: ... }
#
# Or leave her surface-unbound and dispatch to @luna-light over the bus directly.
